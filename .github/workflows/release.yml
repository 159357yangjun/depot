name: Release Bundle

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to publish (for example, v1.0.1)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Validate source contracts
        run: |
          python scripts/validate.py
          python scripts/check_contracts.py
          cargo fmt --all -- --check
          cargo check --workspace
          cargo test --workspace

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Build desktop frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Build Windows bundles
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: multicloud-publisher-windows
          path: target/release/bundle/**
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Depot ${{ inputs.release_tag || github.ref_name }} Windows 正式版
          generate_release_notes: true
          body: |
            ## Depot ${{ github.ref_name }}

            Windows x64 安装包，由 GitHub Actions 从 `dev` 分支构建并验证。

            - NSIS EXE：普通 Windows 用户推荐
            - MSI：企业或自动化部署使用
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  docs-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install docs dependencies
        working-directory: website
        run: npm install
      - name: Build static docs
        working-directory: website
        run: npm run build
      - name: Upload static docs
        uses: actions/upload-artifact@v4
        with:
          name: multicloud-publisher-docs
          path: website/dist/**
          if-no-files-found: error
